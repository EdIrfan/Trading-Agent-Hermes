# Hermes DEMO configuration — same shape as dev, but an isolated environment so
# data-generation runs (scripts/generate_demo_data.py) don't touch the real dev
# paper account. Uses a randomized mock brain, never the real LLM.

environment: demo

broker: paper
starting_cash: 10000.0
quote_currency: USDT

exchange: binance
symbols:
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT
  - BNB/USDT
candle_timeframe: 1h
candle_lookback: 50

taker_fee_rate: 0.001
slippage_rate: 0.0005

max_total_exposure: 0.80
max_position_pct: 0.40
sleeve_fill:
  Buy: 1.0
  Overweight: 0.70
  Hold: null
  Underweight: 0.35
  Sell: 0.0
min_order_notional: 10.0
rebalance_threshold_pct: 0.05

llm_provider: anthropic
deep_think_llm: claude-sonnet-4-6
quick_think_llm: claude-haiku-4-5
max_debate_rounds: 1
max_risk_discuss_rounds: 1
analysts: [market, social, news]
