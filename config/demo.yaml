# Hermes DEMO configuration — same shape as dev, but an isolated environment so
# data-generation runs (scripts/generate_demo_data.py) don't touch the real dev
# paper account. Uses a randomized mock brain, never the real LLM.

environment: demo

broker: paper
starting_cash: 1000.0           # matches the real capital we plan to use
quote_currency: USDT

exchange: binance
symbols:
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT
  - BNB/USDT
  - HYPE/USDT
symbol_exchanges:
  HYPE/USDT: bybit
candle_timeframe: 1h
candle_lookback: 50

taker_fee_rate: 0.001
slippage_rate: 0.0005

strategy: fixed_notional
trade_notional: 10.0
max_position_notional: 200.0
min_order_notional: 5.0

circuit_breaker: true
max_daily_loss_pct: 0.05

llm_provider: anthropic
deep_think_llm: claude-sonnet-4-6
quick_think_llm: claude-haiku-4-5
max_debate_rounds: 1
max_risk_discuss_rounds: 1
analysts: [market, social, news]
