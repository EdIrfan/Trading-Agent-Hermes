# Hermes DEV configuration (paper trading on live Binance prices).
# Non-secret settings live here; secrets live in .env.dev. See docs/context/.

environment: dev

# ---- Broker ----
# "paper" = simulated fills against live prices (DEV). "binance" = real orders (PROD).
broker: paper
starting_cash: 10000.0          # fake USDT the paper account begins with
quote_currency: USDT

# ---- Exchange / market data ----
exchange: binance
symbol: BTC/USDT                 # ccxt unified symbol
candle_timeframe: 1h
candle_lookback: 200             # recent candles fed to the brain snapshot

# ---- Paper-trading frictions (decision D6) ----
# Modeled so DEV results aren't unrealistically rosy.
taker_fee_rate: 0.001            # 0.1% Binance spot taker fee
slippage_rate: 0.0005           # 0.05% assumed slippage on market orders

# ---- Risk / sizing (decision D4 — target-weight, long-only, single asset) ----
# Each 5-tier rating maps to a target % of portfolio value held in the asset;
# Hermes trades the difference. Conservative caps to start.
target_weights:
  Buy: 0.80
  Overweight: 0.60
  Hold: null                     # null = leave current weight unchanged
  Underweight: 0.30
  Sell: 0.0
max_position_pct: 0.80           # hard cap: never more than 80% in the asset
min_order_notional: 10.0         # skip orders smaller than this (Binance min lot guard)
rebalance_threshold_pct: 0.05    # ignore target/actual gaps smaller than 5% (avoid churn)

# ---- LLM (the brain) ----
llm_provider: anthropic
# DEV iteration uses the cheap tier; switch to opus/sonnet for quality runs.
deep_think_llm: claude-sonnet-4-6
quick_think_llm: claude-haiku-4-5
max_debate_rounds: 1
max_risk_discuss_rounds: 1
# Which analysts to run. Fundamentals is auto-dropped for crypto by the brain.
analysts: [market, social, news]
