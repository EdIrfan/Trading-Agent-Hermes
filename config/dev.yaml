# Hermes DEV configuration (paper trading on live prices).
# Non-secret settings live here; secrets live in .env.dev. See docs/context/.

environment: dev

# ---- Broker ----
# "paper" = simulated fills against live prices (DEV). "binance" = real orders (PROD).
broker: paper
starting_cash: 10000.0          # fake USDT the paper account begins with
quote_currency: USDT

# ---- Exchange / market data ----
# The basket. Most coins price on Binance; HYPE (Hyperliquid) is not on Binance
# spot, so it is routed to Bybit via symbol_exchanges.
exchange: binance               # default exchange for price data
symbols:
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT
  - BNB/USDT
  - HYPE/USDT
symbol_exchanges:
  HYPE/USDT: bybit
candle_timeframe: 1h
candle_lookback: 200            # recent candles fed to the brain snapshot

# ---- Paper-trading frictions (decision D6) ----
taker_fee_rate: 0.001           # 0.1% spot taker fee
slippage_rate: 0.0005           # 0.05% assumed slippage on market orders

# ---- Risk / sizing (decision D4) ----
# fixed_notional: take fixed-dollar trades as signals come, capped per coin.
#   Buy / Overweight -> buy trade_notional of the coin (if under the cap & cash allows)
#   Underweight      -> sell one trade_notional's worth
#   Sell             -> close the position
#   Hold             -> nothing
strategy: fixed_notional
trade_notional: 100.0           # USDT bought/sold per signal (change to 50 for smaller trades)
max_position_notional: 2000.0   # hard per-coin cap (max held in any one coin)
min_order_notional: 10.0        # skip dust orders (Binance min-lot guard)

# ---- LLM (the brain) ----
# Using Google Gemini on the FREE tier for testing. gemini-2.5-flash has the
# most generous free limits; both slots use it to stay within quota. Key goes in
# .env.dev as GOOGLE_API_KEY (free key from https://aistudio.google.com/apikey).
llm_provider: google
deep_think_llm: gemini-2.5-flash      # bump to gemini-2.5-pro for stronger reasoning (lower free limits)
quick_think_llm: gemini-2.5-flash
max_debate_rounds: 1                  # keep at 1 on free tier — each round = more API calls
max_risk_discuss_rounds: 1
analysts: [market, social, news]      # fundamentals auto-dropped for crypto by the brain
