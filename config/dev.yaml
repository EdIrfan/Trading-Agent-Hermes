# Hermes DEV configuration (paper trading on live prices).
# Non-secret settings live here; secrets live in .env.dev. See docs/context/.

environment: dev

# ---- Broker ----
# "paper" = simulated fills against live prices (DEV). "binance" = real orders (PROD).
broker: paper
starting_cash: 1000.0           # fake USDT — matches the real capital we plan to use
quote_currency: USDT

# ---- Exchange / market data ----
# The basket. Most coins price on Binance; HYPE (Hyperliquid) is not on Binance
# spot, so it is routed to Bybit via symbol_exchanges.
exchange: binance               # default exchange for price data
symbols:
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT
  - BNB/USDT
  - HYPE/USDT
symbol_exchanges:
  HYPE/USDT: bybit
candle_timeframe: 1h
candle_lookback: 200            # recent candles fed to the brain snapshot

# ---- Paper-trading frictions (decision D6) ----
taker_fee_rate: 0.001           # 0.1% spot taker fee
slippage_rate: 0.0005           # 0.05% assumed slippage on market orders

# ---- Risk / sizing (decision D4) ----
# fixed_notional: take fixed-dollar trades as signals come, capped per coin.
#   Buy / Overweight -> buy trade_notional of the coin (if under the cap & cash allows)
#   Underweight      -> sell one trade_notional's worth
#   Sell             -> close the position
#   Hold             -> nothing
strategy: fixed_notional
trade_notional: 10.0            # USDT bought/sold per signal (small $10 trades on $1k capital)
max_position_notional: 200.0    # hard per-coin cap (max 20% of $1k in any one coin)
min_order_notional: 5.0         # skip dust orders (below half a trade)

# ---- Safety: daily-loss circuit breaker (Phase 3) ----
# If the portfolio falls more than max_daily_loss_pct below the UTC day's opening
# value, block new buys for the rest of the day (sells still allowed). The bot's
# kill switch — a portfolio-level halt no single AI decision can override.
circuit_breaker: true
max_daily_loss_pct: 0.05        # halt new buys after a 5% intraday drawdown

# ---- LLM (the brain) ----
# Using Google Gemini on the FREE tier for testing. gemini-2.5-flash has the
# most generous free limits; both slots use it to stay within quota. Key goes in
# .env.dev as GOOGLE_API_KEY (free key from https://aistudio.google.com/apikey).
llm_provider: google
# One full analysis ≈ 12-20 LLM calls. A STANDARD free AI Studio key (starts with
# "AIza...") gives ~250 requests/day on gemini-2.5-flash → ~10 test runs/day.
# (A restricted "AQ."-prefixed key gives almost none — regenerate a standard key
# at https://aistudio.google.com/apikey if runs hit quota limits immediately.)
# For high-frequency loops use --mock / the demo, which need no quota.
deep_think_llm: gemini-3.1-flash-lite   # 500 req/day free on this key (vs 20 for 3.5-flash)
quick_think_llm: gemini-3.1-flash-lite
max_debate_rounds: 1                  # each round = more API calls; keep at 1 on free tier
max_risk_discuss_rounds: 1
# market = technical/price, social = sentiment. "news" omitted — its macro tool
# needs a free FRED_API_KEY (add it to .env.dev and put "news" back for macro).
analysts: [market, social]
